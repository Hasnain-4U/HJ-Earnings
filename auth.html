<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HJ Earning - Login</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:min(430px,100%);background:rgba(19,16,27,.92);border:1px solid #292331;border-radius:24px;padding:28px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.auth-logo{text-align:center;margin-bottom:22px}.auth-logo h1{margin:0}.auth-logo p{color:#aaa;margin:8px 0 0}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#0f0c15;padding:5px;border-radius:14px;margin-bottom:20px}
.auth-tabs button{border:0;background:transparent;color:#aaa;padding:11px;border-radius:10px;cursor:pointer;font-weight:700}
.auth-tabs button.active{background:#7c3aed;color:#fff}
.auth-form{display:grid;gap:12px}.auth-form input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid #332b40;background:#0f0c15;color:#fff;outline:none}
.auth-form input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.14)}
.auth-btn{border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:800;cursor:pointer}
.auth-msg{min-height:20px;text-align:center;color:#aaa;font-size:14px}.back{display:block;text-align:center;margin-top:16px;color:#aaa;text-decoration:none}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><h1>HJ Earning</h1><p>Secure account access</p></div>
    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Sign Up</button>
    </div>
    <form id="authForm" class="auth-form">
      <input id="name" type="text" placeholder="Full name" autocomplete="name" style="display:none">
      <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
      <input id="referralCode" type="text" placeholder="Referral code (optional)" style="display:none">
      <button class="auth-btn" id="submitBtn" type="submit">Login</button>
      <div class="auth-msg" id="msg"></div>
    </form>
    <a class="back" href="index.html">← Back to dashboard</a>
  </div>
</div>

<script src="auth.js?v=20260920"></script>
<script>
(function(){
  let mode='login';
  const loginTab=document.getElementById('loginTab'), signupTab=document.getElementById('signupTab');
  const name=document.getElementById('name'), email=document.getElementById('email'), password=document.getElementById('password'), referralCode=document.getElementById('referralCode');
  const submitBtn=document.getElementById('submitBtn'), msg=document.getElementById('msg'), form=document.getElementById('authForm');
  function setMode(next){ mode=next; const signup=mode==='signup'; loginTab.classList.toggle('active',!signup); signupTab.classList.toggle('active',signup); name.style.display=signup?'block':'none'; name.required=signup; referralCode.style.display=signup?'block':'none'; submitBtn.textContent=signup?'Create Account':'Login'; msg.textContent=''; }
  loginTab.onclick=()=>setMode('login'); signupTab.onclick=()=>setMode('signup');
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    msg.textContent='Please wait...';
    submitBtn.disabled=true;
    try{
      if(mode==='signup'){
        await HJAuth.signup(name.value.trim(),email.value.trim(),password.value,referralCode.value.trim());
      }else{
        await HJAuth.login(email.value.trim(),password.value);
      }
      location.replace('index.html');
    }catch(err){
      msg.textContent=err.message||'Something went wrong.';
      submitBtn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
